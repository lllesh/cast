  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020408;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }
    .app-root {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 20%, #151b33 0%, #05070F 70%);
    }
    /* Smartphone Device Shell */
    .phone-shell {
      width: 375px;
      height: 812px;
      position: relative;
      background: #05070F;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), 0 0 0 10px #12172a, 0 0 0 12px #26314f;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 480px) {
      .app-root {
        background: #05070F;
      }
      .phone-shell {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }
    /* Screen Viewport */
    .screen-stage {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: #05070F;
      padding-bottom: 70px;
    }
    .screen-stage::-webkit-scrollbar {
      display: none;
    }
    /* Active floating bottom tab bar */
    .bottom-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 330px;
      height: 58px;
      background: rgba(14, 18, 36, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 29px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
      z-index: 50;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
    }
    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #64748B;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 6px 12px;
      border-radius: 16px;
    }
    .tab-btn.active {
      color: #F43F5E;
      background: rgba(244, 63, 94, 0.12);
    }
    .tab-btn svg {
      width: 20px;
      height: 20px;
    }
    /* Top Flow Quick Indicator */
    .flow-badge {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 60;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .flow-badge:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: rgba(244, 63, 94, 0.5);
      color: #fff;
    }
    /* Menu Drawer */
    .drawer {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 12, 0.94);
      backdrop-filter: blur(24px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .drawer.open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

    let currentScreenId = '814-8679';

    function renderScreen(id) {
      const screen = SCREENS[id];
      if (!screen) return;
      const stage = document.getElementById('screen-stage');
      stage.innerHTML = screen.html;
      stage.scrollTop = 0;
      currentScreenId = id;
      
      // Wire up clicks on buttons inside the rendered screen
      wireInteractiveElements();
    }

    function switchNav(tab, screenId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('tab-' + tab);
      if (activeBtn) activeBtn.classList.add('active');

      const names = {
        'feed': '13. Real',
        'channels': '32. Canais',
        'create': '23. Tirar Foto',
        'connect': '17. Conexão',
        'profile': '37. Perfil'
      };
      goTo(screenId, names[tab] || 'Tela', tab);
    }

    function goTo(screenId, title, tab) {
      renderScreen(screenId);
      document.getElementById('badge-title').innerText = title;
      if (tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById('tab-' + tab);
        if (activeBtn) activeBtn.classList.add('active');
      }
      document.getElementById('drawer').classList.remove('open');
    }

    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('open');
    }

    function wireInteractiveElements() {
      const stage = document.getElementById('screen-stage');
      
      // Wire up links, buttons, inputs, icons
      stage.querySelectorAll('[data-name="Button"], [data-name*="Button"], button, [role="button"]').forEach(el => {
        el.style.cursor = 'pointer';
        el.addEventListener('click', (e) => {
          const text = el.innerText.trim().toLowerCase();
          if (text.includes('sign in') || text.includes('log in')) {
            goTo('816-13470', '10. Login', null);
          } else if (text.includes('register') || text.includes('sign up')) {
            goTo('812-7870', '2. Cadastro', null);
          } else if (text.includes('continue') || text.includes('next')) {
            if (currentScreenId === '812-7870') goTo('816-12830', '3. Cadastro 2', null);
            else if (currentScreenId === '816-12830') goTo('824-22456', '4. Cadastro 3', null);
            else if (currentScreenId === '824-22456') goTo('814-8679', '13. Real', 'feed');
            else if (currentScreenId === '824-19805') goTo('824-19966', '25. Adicionar Título', 'create');
            else if (currentScreenId === '824-19966') goTo('824-20510', '28. Publicado', 'create');
            else if (currentScreenId === '824-20652') goTo('824-20717', '31. Vídeo Pronto', 'create');
          }
        });
      });

      // Real screen: click on reactions
      stage.querySelectorAll('[data-name*="Reaction"], [data-name*="Emoji"]').forEach(el => {
        el.style.cursor = 'pointer';
        el.addEventListener('click', () => {
          goTo('822-16400', '15. Escolher Emoji', 'feed');
        });
      });

      // Click on camera shutter button to capture photo
      stage.querySelectorAll('[data-name*="IconShutter"], [data-name*="Shutter"], [data-name*="Record"]').forEach(el => {
        el.style.cursor = 'pointer';
        el.addEventListener('click', () => {
          if (currentScreenId === '814-8963') goTo('824-19805', '24. Foto Tirada', 'create');
          else if (currentScreenId === '824-20652') goTo('824-20717', '31. Vídeo Pronto', 'create');
        });
      });
    }

    // Initial render
    renderScreen('814-8679');
  </script>
