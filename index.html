<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Broadcast</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }
    .app-viewport {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 890px;
      background: #06070B;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.08);
    }
    @media (max-width: 640px) {
      .app-viewport {
        max-width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
    }
    .custom-scroll::-webkit-scrollbar { display: none; }
    .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#05060A]">

  <div class="app-viewport sm:rounded-[44px]">
    <!-- iOS / Mobile Status Bar -->
    <div class="h-11 px-7 flex items-center justify-between text-xs font-semibold text-white/90 shrink-0 z-30 select-none">
      <span id="app-clock">09:41</span>
      <div class="w-24 h-4.5 bg-black rounded-full border border-white/10 flex items-center justify-center">
        <div class="w-2 h-2 rounded-full bg-emerald-500/80 mr-1.5 animate-pulse"></div>
        <div class="w-2 h-2 rounded-full bg-pink-500/80"></div>
      </div>
      <div class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
        <div class="w-5 h-2.5 rounded-sm border border-white/80 p-0.5 flex items-center">
          <div class="w-full h-full bg-white rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Active Screen Viewport -->
    <main id="app-screen" class="flex-1 overflow-y-auto overflow-x-hidden relative custom-scroll"></main>

    <!-- Bottom Navigation Bar -->
    <nav class="h-20 bg-[#0B0E1B]/95 backdrop-blur-2xl border-t border-white/10 px-4 flex items-center justify-around shrink-0 z-40 select-none">
      <button onclick="navigate('feed')" id="nav-feed" class="flex flex-col items-center gap-1 text-pink-500 transition active:scale-95">
        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-[10px] font-semibold">Feed</span>
      </button>

      <button onclick="navigate('channels')" id="nav-channels" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition active:scale-95">
        <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
        <span class="text-[10px] font-semibold">Canais</span>
      </button>

      <button onclick="navigate('create')" id="nav-create" class="flex flex-col items-center justify-center -mt-6 transition active:scale-90">
        <div class="w-13 h-13 rounded-full bg-gradient-to-tr from-pink-600 to-rose-400 p-0.5 shadow-lg shadow-pink-500/40">
          <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-pink-500 to-rose-500 flex items-center justify-center text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          </div>
        </div>
        <span class="text-[10px] font-semibold text-slate-400 mt-1">Postar</span>
      </button>

      <button onclick="navigate('connect')" id="nav-connect" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition active:scale-95">
        <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
        <span class="text-[10px] font-semibold">Conectar</span>
      </button>

      <button onclick="navigate('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition active:scale-95">
        <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px] font-semibold">Perfil</span>
      </button>
    </nav>
  </div>

  <!-- Real Interactive App Logic -->
  <script>
    const appState = {
      tab: 'feed',
      reals: [
        {
          id: 1,
          author: 'Annie',
          time: '15m atrás',
          avatar: 'assets/814-11563_imgAvatar.png',
          title: 'Happy Halloween Day 🎃',
          image: 'assets/814-8679_imgImage.png',
          reactions: ['🔥 142', '❤️ 89', '😍 47'],
          liked: false,
          comments: ['Incrível esse efeito de fumaça!', 'Ficou surreal demais 🔥']
        },
        {
          id: 2,
          author: 'Carlos Mendes',
          time: '1h atrás',
          avatar: 'assets/814-11563_imgAvatar1.png',
          title: 'Studio session vibes 🎧',
          image: 'assets/824-20417_imgImage.png',
          reactions: ['⚡ 94', '🎧 63'],
          liked: true,
          comments: ['Solta o som!']
        }
      ],
      channels: [
        { id: 'dev', name: 'Design & Code Brasil', members: '14.2k membros', lastMsg: 'Novo build publicado no Edge com sucesso!', avatar: 'assets/812-8517_imgEllipse1.png' },
        { id: 'crypto', name: 'Web3 & Creators', members: '8.7k membros', lastMsg: 'Airdrop confirmado para holders.', avatar: 'assets/812-8517_imgEllipse2.png' },
        { id: 'daily', name: 'Leticia Drops ⚡', members: '2.5k membros', lastMsg: 'Trabalhando no novo app móvel agora.', avatar: 'assets/814-12427_imgAvatar.png' }
      ]
    };

    function renderFeed() {
      const screen = document.getElementById('app-screen');
      screen.innerHTML = `
        <div class="p-4 space-y-5">
          <!-- Top Stories/Active Reals -->
          <div class="flex items-center gap-3 overflow-x-auto pb-2 custom-scroll">
            <div class="flex flex-col items-center gap-1.5 shrink-0 cursor-pointer" onclick="navigate('create')">
              <div class="w-16 h-16 rounded-full border-2 border-dashed border-pink-500/80 p-0.5 flex items-center justify-center bg-white/5">
                <span class="text-xl text-pink-400 font-bold">+</span>
              </div>
              <span class="text-[11px] text-slate-300">Seu Real</span>
            </div>
            ${appState.reals.map(r => `
              <div class="flex flex-col items-center gap-1.5 shrink-0 cursor-pointer">
                <div class="w-16 h-16 rounded-full ring-2 ring-pink-500 p-0.5 overflow-hidden">
                  <img src="${r.avatar}" class="w-full h-full object-cover rounded-full" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop'">
                </div>
                <span class="text-[11px] text-slate-300 truncate max-w-[64px]">${r.author}</span>
              </div>
            `).join('')}
          </div>

          <!-- Feed Posts -->
          ${appState.reals.map(r => `
            <div class="bg-[#0E1222] border border-white/10 rounded-3xl overflow-hidden shadow-xl">
              <!-- Post Header -->
              <div class="p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <img src="${r.avatar}" class="w-10 h-10 rounded-full object-cover ring-1 ring-white/20" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop'">
                  <div>
                    <h3 class="text-sm font-bold text-white">${r.author}</h3>
                    <p class="text-[11px] text-slate-400">${r.time}</p>
                  </div>
                </div>
                <button class="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center text-slate-400">•••</button>
              </div>

              <!-- Main Media -->
              <div class="relative w-full aspect-[4/5] bg-black">
                <img src="${r.image}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop'">
                <div class="absolute bottom-4 left-4 right-4 bg-black/60 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-white/10">
                  <p class="text-xs font-semibold text-white">${r.title}</p>
                </div>
              </div>

              <!-- Reactions & Action Bar -->
              <div class="p-4 space-y-3">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <button onclick="toggleLike(${r.id})" class="px-3 py-1.5 rounded-full ${r.liked ? 'bg-pink-600 text-white' : 'bg-white/10 text-slate-300'} text-xs font-semibold flex items-center gap-1.5 transition">
                      <span>${r.liked ? '❤️ Curtiu' : '🤍 Curtir'}</span>
                    </button>
                    <button onclick="addQuickEmoji(${r.id}, '🔥')" class="px-2.5 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-xs transition">🔥</button>
                    <button onclick="addQuickEmoji(${r.id}, '😍')" class="px-2.5 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-xs transition">😍</button>
                    <button onclick="addQuickEmoji(${r.id}, '👏')" class="px-2.5 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-xs transition">👏</button>
                  </div>
                  <button class="text-slate-400 hover:text-white p-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                  </button>
                </div>

                <!-- Comments list -->
                <div class="space-y-1.5 text-xs text-slate-300 pt-1">
                  ${r.comments.map(c => `<p><span class="font-bold text-white">Seguidor:</span> ${c}</p>`).join('')}
                </div>

                <!-- Comment Input -->
                <div class="flex items-center gap-2 pt-2 border-t border-white/5">
                  <input id="input-comment-${r.id}" type="text" placeholder="Adicionar comentário..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
                  <button onclick="postComment(${r.id})" class="px-3 py-2 bg-pink-600 hover:bg-pink-500 text-white font-semibold rounded-xl text-xs transition">Enviar</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderChannels() {
      const screen = document.getElementById('app-screen');
      screen.innerHTML = `
        <div class="p-5 space-y-4">
          <div class="flex items-center justify-between pb-2 border-b border-white/10">
            <div>
              <h2 class="text-xl font-bold text-white">Broadcast Channels</h2>
              <p class="text-xs text-slate-400">Transmissões oficiais e comunidades</p>
            </div>
            <button class="px-3 py-1.5 bg-pink-600 hover:bg-pink-500 text-white rounded-xl text-xs font-semibold">+ Criar</button>
          </div>

          <div class="space-y-3">
            ${appState.channels.map(c => `
              <div onclick="openChannel('${c.id}')" class="p-4 bg-[#0E1222] border border-white/10 hover:border-pink-500/50 rounded-2xl flex items-center justify-between cursor-pointer transition">
                <div class="flex items-center gap-3">
                  <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-pink-500 p-0.5">
                    <img src="${c.avatar}" class="w-full h-full rounded-2xl object-cover" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop'">
                  </div>
                  <div>
                    <h3 class="text-sm font-bold text-white">${c.name}</h3>
                    <p class="text-xs text-pink-400 font-medium">${c.members}</p>
                    <p class="text-[11px] text-slate-400 truncate max-w-[200px] mt-0.5">${c.lastMsg}</p>
                  </div>
                </div>
                <div class="text-slate-500 text-xs">›</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCreate() {
      const screen = document.getElementById('app-screen');
      screen.innerHTML = `
        <div class="p-6 h-full flex flex-col justify-between">
          <div>
            <h2 class="text-xl font-bold text-white">Criar Novo Real</h2>
            <p class="text-xs text-slate-400 mt-1">Capture uma foto ou compartilhe uma atualização</p>
            
            <div class="mt-6 aspect-[4/5] bg-zinc-900 border border-dashed border-white/20 rounded-3xl flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
              <svg class="w-12 h-12 text-pink-500 mb-3" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/></svg>
              <p class="text-sm font-semibold text-white">Toque para Abrir Câmera</p>
              <p class="text-xs text-slate-500 mt-1">PNG, JPG ou vídeo até 30s</p>
            </div>

            <div class="mt-4">
              <input type="text" id="post-title" placeholder="Escreva uma legenda ou título do Real..." class="w-full bg-[#0E1222] border border-white/10 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500">
            </div>
          </div>

          <button onclick="publishNewReal()" class="w-full py-4 bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 text-white font-bold rounded-2xl shadow-lg shadow-pink-600/30 transition">
            Publicar Real Agora ✨
          </button>
        </div>
      `;
    }

    function renderConnect() {
      const screen = document.getElementById('app-screen');
      screen.innerHTML = `
        <div class="p-6 text-center space-y-6">
          <div>
            <h2 class="text-xl font-bold text-white">Conexão & QR Code</h2>
            <p class="text-xs text-slate-400 mt-1">Aponte a câmera para sincronizar novos amigos</p>
          </div>

          <div class="mx-auto w-64 h-64 bg-white p-4 rounded-3xl shadow-2xl relative flex items-center justify-center">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://cast.lle.sh" class="w-full h-full object-contain">
            <div class="absolute inset-0 border-4 border-pink-500 rounded-3xl animate-pulse pointer-events-none"></div>
          </div>

          <div class="p-4 bg-[#0E1222] border border-white/10 rounded-2xl text-left">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-pink-500/20 text-pink-400 flex items-center justify-center font-bold">✓</div>
              <div>
                <p class="text-sm font-bold text-white">Seu Link de Convite</p>
                <p class="text-xs text-slate-400 font-mono">cast.lle.sh/@leticia</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderProfile() {
      const screen = document.getElementById('app-screen');
      screen.innerHTML = `
        <div class="p-6 space-y-6">
          <div class="flex items-center gap-4">
            <div class="w-20 h-20 rounded-full ring-2 ring-pink-500 p-1">
              <img src="assets/814-12427_imgAvatar.png" class="w-full h-full rounded-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop'">
            </div>
            <div>
              <h2 class="text-lg font-bold text-white">Leticia Piccolo</h2>
              <p class="text-xs text-pink-400 font-medium">@leticia • Criadora</p>
              <div class="flex items-center gap-4 mt-2 text-xs text-slate-300">
                <span><b>45</b> Reals</span>
                <span><b>12.8k</b> Seguidores</span>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div class="aspect-square bg-white/5 rounded-xl overflow-hidden"><img src="assets/814-8679_imgImage.png" class="w-full h-full object-cover"></div>
            <div class="aspect-square bg-white/5 rounded-xl overflow-hidden"><img src="assets/824-20417_imgImage.png" class="w-full h-full object-cover"></div>
            <div class="aspect-square bg-white/5 rounded-xl overflow-hidden flex items-center justify-center text-slate-600 font-bold">+</div>
          </div>
        </div>
      `;
    }

    function navigate(tabKey) {
      appState.tab = tabKey;
      ['feed', 'channels', 'create', 'connect', 'profile'].forEach(t => {
        const btn = document.getElementById('nav-' + t);
        if (!btn) return;
        if (t === tabKey) {
          btn.classList.add('text-pink-500');
          btn.classList.remove('text-slate-400');
        } else {
          btn.classList.remove('text-pink-500');
          btn.classList.add('text-slate-400');
        }
      });

      if (tabKey === 'feed') renderFeed();
      else if (tabKey === 'channels') renderChannels();
      else if (tabKey === 'create') renderCreate();
      else if (tabKey === 'connect') renderConnect();
      else if (tabKey === 'profile') renderProfile();
    }

    function toggleLike(id) {
      const item = appState.reals.find(r => r.id === id);
      if (item) {
        item.liked = !item.liked;
        renderFeed();
      }
    }

    function addQuickEmoji(id, emoji) {
      const item = appState.reals.find(r => r.id === id);
      if (item) {
        item.reactions.push(emoji + ' 1');
        renderFeed();
      }
    }

    function postComment(id) {
      const inp = document.getElementById('input-comment-' + id);
      if (inp && inp.value.trim()) {
        const item = appState.reals.find(r => r.id === id);
        if (item) {
          item.comments.push(inp.value.trim());
          renderFeed();
        }
      }
    }

    function publishNewReal() {
      const title = document.getElementById('post-title')?.value || 'Novo Momento';
      appState.reals.unshift({
        id: Date.now(),
        author: 'Você',
        time: 'Agora mesmo',
        avatar: 'assets/814-12427_imgAvatar.png',
        title: title,
        image: 'assets/814-8679_imgImage.png',
        reactions: ['🔥 1'],
        liked: true,
        comments: []
      });
      navigate('feed');
    }

    function updateClock() {
      const d = new Date();
      document.getElementById('app-clock').innerText = 
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Init
    navigate('feed');
  </script>
</body>
</html>
